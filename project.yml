name: ClipShelf
options:
  bundleIdPrefix: com.maximtschitschko
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateAllTargetSchemes: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "8936F2R3FF"
    ENABLE_PREVIEWS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.5

targets:
  ClipShelf:
    type: application
    platform: macOS
    sources:
      - path: ClipShelf
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maximtschitschko.ClipShelf
        PRODUCT_NAME: ClipShelf
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Maxim Tschitschko"
        NSAppleEventsUsageDescription: "ClipShelf sendet Tastatureingaben, um kopierte Inhalte direkt einzufügen."
        SUFeedURL: "https://raw.githubusercontent.com/n8sdk2vwbz-tech/ClipShelf/main/appcast.xml"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUPublicEDKey: "NOHkrCf4kgFI/erXwvrpmwVKAlSNYjfvcMUaQax+LDE="
